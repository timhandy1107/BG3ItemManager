name: Build portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile and run regression tests
        run: dotnet run --project Tests/BG3ItemManager.ImportTests.csproj -c Release

      - name: Build portable EXE
        run: >
          dotnet publish BG3ItemManager.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Include bridge and update tools
        shell: pwsh
        run: |
          Copy-Item -LiteralPath BridgeMod -Destination publish/BridgeMod -Recurse
          Copy-Item -LiteralPath Tools -Destination publish/Tools -Recurse
          Copy-Item -LiteralPath README.md -Destination publish/README.md

      - name: Upload portable app and tools
        uses: actions/upload-artifact@v4
        with:
          name: BG3ItemManager-Windows-x64
          path: publish/**
